apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventdesk
  namespace: eventdesk
spec:
  ingressClassName: traefik
  rules:
    - host: eventdesk.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: eventdesk
                port:
                  number: 80
