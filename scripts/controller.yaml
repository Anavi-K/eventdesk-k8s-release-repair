apiVersion: v1
kind: Namespace
metadata: {name: eventdesk-edge}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: traefik, namespace: eventdesk-edge}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: eventdesk-edge}
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: eventdesk-edge}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: eventdesk-edge}
subjects:
  - {kind: ServiceAccount, name: traefik, namespace: eventdesk-edge}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: {name: traefik}
spec: {controller: traefik.io/ingress-controller}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: traefik, namespace: eventdesk-edge}
spec:
  replicas: 1
  selector:
    matchLabels: {app: traefik}
  template:
    metadata:
      labels: {app: traefik}
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.3.4
          args:
            - --entrypoints.web.address=:8000
            - --providers.kubernetesingress
            - --providers.kubernetesingress.ingressclass=traefik
          ports:
            - {name: web, containerPort: 8000}
          readinessProbe:
            tcpSocket: {port: web}
---
apiVersion: v1
kind: Service
metadata: {name: traefik, namespace: eventdesk-edge}
spec:
  type: NodePort
  selector: {app: traefik}
  ports:
    - {port: 80, targetPort: web, nodePort: 30080}
